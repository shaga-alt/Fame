<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAGA MUSIC</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#121212;
 color:white;
 font-family:Arial,sans-serif;
 padding-bottom:180px;
}

header{
 display:flex;
 align-items:center;
 gap:12px;
 padding:18px;
 position:sticky;
 top:0;
 background:#121212;
 z-index:5;
}

.logo{
 background:#1ed760;
 color:black;
 width:42px;
 height:42px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:22px;
}

.brand{
 font-size:20px;
 font-weight:bold;
 letter-spacing:2px;
}

nav.top{
 display:flex;
 gap:10px;
 padding:0 15px 15px;
 overflow-x:auto;
}

.chip{
 background:#303030;
 color:white;
 border:0;
 padding:12px 22px;
 border-radius:30px;
 white-space:nowrap;
}

.chip.active{
 background:#1ed760;
 color:black;
}

main{
 padding:12px 15px;
 max-width:1000px;
 margin:auto;
}

.page{display:none}
.page.active{display:block}

h2{
 font-size:24px;
 margin-top:30px;
}

.quick-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.quick-card{
 display:flex;
 align-items:center;
 background:#292929;
 border-radius:7px;
 overflow:hidden;
 min-height:80px;
 cursor:pointer;
}

.quick-card img{
 width:85px;
 height:80px;
 object-fit:cover;
}

.quick-card span{
 padding:10px;
 font-weight:bold;
}

.featured{
 display:flex;
 background:#242424;
 border-radius:12px;
 overflow:hidden;
 margin-top:15px;
 min-height:210px;
}

.featured img{
 width:45%;
 object-fit:cover;
}

.feature-info{
 padding:18px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.feature-info p{
 color:#bbb;
 line-height:1.5;
}

.round-play{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#1ed760;
 border:0;
 font-size:22px;
 margin-top:10px;
}

.horizontal{
 display:flex;
 gap:15px;
 overflow-x:auto;
 padding:10px 0 20px;
}

.mix{
 min-width:170px;
 width:170px;
 cursor:pointer;
}

.mix img{
 width:170px;
 height:170px;
 border-radius:8px;
 object-fit:cover;
}

.mix h3{
 font-size:15px;
 margin-bottom:5px;
}

.mix p{
 color:#aaa;
 font-size:13px;
 line-height:1.4;
}

input{
 width:100%;
 padding:15px;
 border-radius:8px;
 border:1px solid #444;
 background:#252525;
 color:white;
 margin:10px 0;
}

button{
 cursor:pointer;
}

.green{
 background:#1ed760;
 color:black;
 border:0;
 border-radius:30px;
 padding:13px 23px;
 font-weight:bold;
}

.dark-button{
 background:#303030;
 color:white;
 border:0;
 border-radius:25px;
 padding:12px 20px;
 margin:5px;
}

.song{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px 5px;
 border-bottom:1px solid #292929;
 cursor:pointer;
}

.song img{
 width:55px;
 height:55px;
 object-fit:cover;
 border-radius:6px;
}

.song-info{
 flex:1;
 min-width:0;
}

.song-info h3{
 font-size:15px;
 margin:0 0 5px;
}

.song-info p{
 margin:0;
 color:#aaa;
 font-size:13px;
}

.song button{
 background:none;
 color:#1ed760;
 border:0;
 font-size:22px;
}

.panel{
 background:#242424;
 padding:20px;
 border-radius:12px;
 margin:15px 0;
}

.bottom-player{
 position:fixed;
 bottom:75px;
 left:10px;
 right:10px;
 background:#333;
 border-radius:10px;
 padding:10px;
 display:none;
 align-items:center;
 gap:10px;
 z-index:10;
}

.bottom-player img{
 width:45px;
 height:45px;
 border-radius:5px;
 object-fit:cover;
}

.player-info{
 flex:1;
 min-width:0;
}

.player-info strong{
 display:block;
 font-size:14px;
}

.player-info span{
 color:#bbb;
 font-size:12px;
}

.player-controls button{
 background:none;
 border:0;
 color:white;
 font-size:22px;
}

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:75px;
 background:#080808;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:20
